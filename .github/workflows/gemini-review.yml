name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: google-gemini/gemini-github-action@v1 # 예시 액션명
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # 상세 설정 (모델명, 리뷰 스타일 등)
          model: 'gemini-1.5-flash'
